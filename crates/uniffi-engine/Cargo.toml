[package]
name = "napi-uniffi-engine"
version = "0.1.0"
description = "Programmatic napi-rs backend for UniFFI JavaScript bridge plans"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/EverglowStudio/napi-rs"
rust-version.workspace = true

[dependencies]
napi = { path = "../napi", version = "3.12.0", default-features = false, features = ["napi6", "async-runtime"] }
napi-derive-backend = { path = "../backend", version = "6.1.1" }
napi-family-core = { path = "../napi-family-core", version = "0.1.0" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["extra-traits", "full"] }
uniffi_js_abi = { git = "https://github.com/EverglowStudio/uniffi-rs.git", rev = "4361fc73c10e36bdfc3fd0438ed63d9f2e130cd4", version = "=0.32.0" }
uniffi_js_engine_schema = { git = "https://github.com/EverglowStudio/uniffi-rs.git", rev = "4361fc73c10e36bdfc3fd0438ed63d9f2e130cd4", version = "=0.32.0" }

[lints]
workspace = true
